name: numcross
description: "NumCross - Math Crossword Mobile Puzzle Game for iOS & Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  shared_preferences: ^2.2.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  supabase_flutter: ^2.5.6
  audioplayers: ^6.8.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  vibration: ^3.2.1
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/branding/
    - assets/audio/

# Native splash (Android 12+ + iOS LaunchScreen) — run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#002C92"
  color_dark: "#002C92"
  image: assets/branding/splash_logo_centered.png
  image_dark: assets/branding/splash_logo_centered.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#002C92"
    color_dark: "#002C92"
    # Padded so Android 12's circular mask does not crop "Math Puzzle".
    image: assets/branding/splash_logo_android12.png
    image_dark: assets/branding/splash_logo_android12.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: false
